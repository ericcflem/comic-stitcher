# Runs the test suite on Windows and Linux for every change, so neither
# platform falls behind. Tests use Qt's offscreen display, so no screen is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Python bundled with the Windows release.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Linux libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Comic Stitcher's requirements
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        # Tests of a built Windows release (verify_*.py, test_installed_runtime_verifier)
        # need a packaged build and are not run here.
        shell: bash
        run: python -m unittest discover -s comic_builder -t . -v 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Attach failures to the run summary
        # Puts each failing test's report where it shows on the pull request.
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re, sys
          try:
              text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=Setup failed::The tests did not start; an earlier step failed.")
              sys.exit(0)
          blocks = re.split(r"\n(?==+\n(?:ERROR|FAIL): )", text)
          reports = [b.strip("=\n") for b in blocks if re.match(r"=+\n(?:ERROR|FAIL): ", b)] or [text[-6000:]]
          for report in reports[:9]:
              body = report[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Test failure::{body}")
          summary = text.strip().splitlines()[-3:]
          print("::error title=Summary::" + "%0A".join(summary))
          EOF
