# Runs the test suite on Windows and Linux for every change, so neither
# platform falls behind. Tests use Qt's offscreen display, so no screen is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Use a temporary folder without a shortened name
        # GitHub's Windows machines give the default temp folder an old-style
        # short name (RUNNER~1). The app resolves it to the full name and some
        # tests then see two spellings of one folder, which an ordinary PC avoids.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Keep files byte-for-byte as stored
        # Git on GitHub's Windows machines converts line endings on checkout, which
        # changes the fingerprints the license checks compare against.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Python bundled with the Windows release.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Linux libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Comic Stitcher's requirements
        # The packaging tests also use these release tools, pinned to the versions
        # in requirements-release.txt.
        run: >
          python -m pip install -r requirements.txt
          packaging==26.3 pefile==2024.8.26
          pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      - name: Run the tests
        # Tests of a built Windows release (verify_*.py, test_installed_runtime_verifier)
        # need a packaged build and are not run here.
        shell: bash
        # run_tests.py prints each failure as it happens and stops a test that hangs.
        run: python -u .github/run_tests.py 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Attach failures to the run summary
        # Puts each failing test's report where it shows on the pull request.
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import re, sys
          try:
              text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              print("::error title=Setup failed::The tests did not start; an earlier step failed.")
              sys.exit(0)
          def emit(title, body):
              body = body[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={title}::{body}")
          lines = text.splitlines()
          # Which tests did not pass, from unittest's verbose "... ERROR" / "... FAIL" lines.
          bad = [l for l in lines if re.search(r"\.\.\. (ERROR|FAIL)$", l) or re.match(r"(ERROR|FAIL): ", l)]
          emit("Failing tests", "\n".join(bad) or "(none reported; the run may have stopped early)")
          started = [l for l in lines if re.match(r"test\w* \(.*\) \.\.\.", l)]
          if started and not re.search(r"\.\.\. (ok|ERROR|FAIL|skipped.*|expected failure)$", started[-1]):
              emit("Stuck test", "Still running when the run stopped:\n" + started[-1])
          ran = [l for l in lines if re.match(r"(Ran \d+ tests|OK|FAILED \()", l)]
          emit("Result", "\n".join(ran) or "(no result line; the test process may have crashed)")
          # Each failure as run_tests.py printed it, then the end of the log.
          blocks = re.split(r"\n(?=----- (?:ERROR|FAIL): )", text)
          for block in [b for b in blocks if re.match(r"----- (?:ERROR|FAIL): ", b)][:8]:
              block = re.split(r"\ntest\w* \(", block)[0]  # stop at the next test's line
              emit("Test failure", block[:3500])
          emit("End of log", text[-3500:])
          EOF

  linux-install:
    # Runs linux/install.sh and uninstall.sh the way a user would, on Ubuntu's own Python.
    name: linux-install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check the scripts with ShellCheck
        # Findings are shown as annotations on the pull request.
        shell: bash
        run: >
          shellcheck -f gcc linux/install.sh linux/uninstall.sh linux/repair-prompt.sh
          linux/nautilus/open-in-comic-stitcher.sh
          | sed -E 's/^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$/::error file=\1,line=\2,col=\3::\4/'

      - name: Install the desktop-file checker and basic desktop libraries
        # GitHub's machines are servers; every desktop already has these graphics libraries.
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          desktop-file-utils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          xvfb x11-utils

      - name: Install Comic Stitcher
        run: linux/install.sh --yes

      - name: Check the installation
        run: python3 .github/check_linux_install.py installed

      - name: Check the main window and drop tab have separate window names
        # Runs both on a virtual X display, as on an X11 or XWayland desktop.
        run: xvfb-run -a python3 .github/check_linux_install.py windows

      - name: Check the repair prompt for a broken environment
        run: python3 .github/check_linux_install.py repair

      - name: Install again, as an update would
        run: linux/install.sh --yes

      - name: Check the installation again
        run: python3 .github/check_linux_install.py installed

      - name: Uninstall with --purge
        run: |
          mkdir -p ~/.config/ComicStitcher && touch ~/.config/ComicStitcher/settings-test
          ~/.local/share/comic-stitcher/uninstall.sh --yes --purge

      - name: Check everything was removed
        run: python3 .github/check_linux_install.py removed
