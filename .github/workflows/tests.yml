# Runs the test suite on Windows and Linux for every change, so neither
# platform falls behind. Tests use Qt's offscreen display, so no screen is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Python bundled with the Windows release.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Linux libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install Comic Stitcher's requirements
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        # Tests of a built Windows release (verify_*.py, test_installed_runtime_verifier)
        # need a packaged build and are not run here.
        run: python -m unittest discover -s comic_builder -t . -v
