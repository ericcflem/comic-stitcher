# Builds the Linux AppImage (see packaging/appimage/README.md) from pinned
# inputs, starts it on a virtual screen to check that it runs, and keeps it as a
# download on the run's page (Artifacts). Runs for changes to the AppImage's
# files and on request; and when a release is published, attaches the AppImage
# to it and adds its line to the release's SHA256SUMS.txt.
name: AppImage

on:
  pull_request:
    paths:
      - "packaging/appimage/**"
      - "packaging/package_licenses.py"
      - "launch.py"
      - ".github/workflows/appimage.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: appimage
    # The oldest Ubuntu GitHub offers: its C library sets the oldest Linux the AppImage runs on.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The same Python as the Windows release.
          python-version: "3.14.2"

      - name: Install the libraries Qt's screen support needs, so they're bundled
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Install the pinned libraries and PyInstaller
        # Exactly the versions recorded, each wheel checked against its hash.
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r packaging/appimage/requirements-linux.txt
          python -m pip check

      - name: Build the AppImage
        run: |
          set -o pipefail
          packaging/appimage/build_appimage.sh 2>&1 | tee build-appimage.log

      - name: Show where the build failed
        # Puts the end of its output on the pull request.
        if: failure()
        run: |
          body=$(tail -c 3500 build-appimage.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=build_appimage.sh::$body"

      - name: Start it on a virtual screen
        # It should still be running when stopped after 25 seconds (exit 124), with
        # nothing alarming in its log.
        run: |
          image=$(ls dist/ComicStitcher-*-x86_64.AppImage)
          set +e
          xvfb-run -a timeout 25 "$image" --appimage-extract-and-run
          status=$?
          set -e
          log=$(ls -t ~/.local/share/ComicStitcher/logs/*.log | head -1)
          cat "$log"
          if [ "$status" -ne 124 ]; then
            echo "::error title=AppImage::It stopped by itself (exit $status) instead of running."
            exit 1
          fi
          if grep -E "CRITICAL|Traceback" "$log"; then
            echo "::error title=AppImage::Its log shows an error."
            exit 1
          fi
          echo "Ran for 25 seconds; size: $(du -h "$image" | cut -f1)"

      - name: Start it again from inside itself, as the drop tab does, without the system's X11 libraries
        # Ubuntu doesn't install some of the X11 libraries Qt needs (install.sh
        # offers them); the AppImage brings its own. A copy started from a
        # running one (the drop tab opening a comic) must find them too.
        run: |
          image=$(realpath dist/ComicStitcher-*-x86_64.AppImage)
          sudo apt-get remove -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0
          mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && "$image" --appimage-extract >/dev/null
          app="$RUNNER_TEMP/x/squashfs-root/usr/lib/comic-stitcher/comic-stitcher"
          export QT_QPA_PLATFORM=xcb
          Xvfb :91 -screen 0 1280x1024x24 & sleep 2
          export DISPLAY=:91
          "$RUNNER_TEMP/x/squashfs-root/AppRun" --drop-tab & sleep 8
          pid=$(pgrep -f -- "$app --drop-tab" | head -1)
          [ -n "$pid" ] || { echo "::error::The drop tab didn't start."; exit 1; }
          # What a program it starts inherits, PyInstaller's markers included.
          tr '\0' '\n' < /proc/$pid/environ | grep '^_PYI\|^PYINSTALLER' | sed 's/^/  /'
          run_child() {
            set +e
            env $(tr '\0' '\n' < /proc/$pid/environ | grep '^_PYI' | tr '\n' ' ') "$@" timeout 15 "$app"
            status=$?
            set -e
          }
          run_child
          echo "::notice title=Started from the drop tab the old way::exit $status (124 = still running; 134 = could not start)"
          run_child PYINSTALLER_RESET_ENVIRONMENT=1
          echo "::notice title=Started from the drop tab now::exit $status"
          kill $pid || true
          if [ "$status" -ne 124 ]; then
            echo "::error title=AppImage::Started from the drop tab, it stopped by itself (exit $status)."
            exit 1
          fi

      - name: Check the bundled UnRAR, cwebp and notices
        run: |
          app="$RUNNER_TEMP/x/squashfs-root/usr/lib/comic-stitcher"
          "$app/unrar" | head -2
          "$app/cwebp" -version
          test -s "$app/licenses/index.html"
          grep -q "UnRAR" "$app/licenses/index.html"
          echo "::notice title=Notices::$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(", ".join(r["name"] + " " + r["version"] for r in d["packages"] + d["runtime_tool_notices"]))' "$app/licenses/build-inventory.json")"

      - name: Keep the AppImage as a download
        uses: actions/upload-artifact@v4
        with:
          name: ComicStitcher-AppImage
          path: dist/ComicStitcher-*-x86_64.AppImage
          retention-days: 30

  release:
    # A published release: attach the AppImage built from its tag.
    if: github.event_name == 'release'
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ComicStitcher-AppImage
          path: appimage

      - name: Attach the AppImage and add it to SHA256SUMS.txt
        run: |
          image=$(ls appimage/ComicStitcher-*-x86_64.AppImage)
          name=$(basename "$image")
          version=${name#ComicStitcher-}; version=${version%-x86_64.AppImage}
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=AppImage::The release is $TAG, but its code is version $version."
            exit 1
          fi
          gh release upload "$TAG" "$image" --repo "$GITHUB_REPOSITORY" --clobber
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir sums; then
            grep -v "  $name\$" sums/SHA256SUMS.txt > SHA256SUMS.txt || true
          else
            echo "::warning title=AppImage::The release had no SHA256SUMS.txt; starting one."
            : > SHA256SUMS.txt
          fi
          (cd appimage && sha256sum "$name") >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
